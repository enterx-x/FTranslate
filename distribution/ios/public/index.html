<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>安装 FTranslate Mobile</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; background: #edf1f6; color: #131b2b; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px 18px; }
      main { width: min(100%, 420px); padding: 26px 22px; border-radius: 14px; background: white; box-shadow: 0 8px 20px rgba(20,32,52,.12); }
      h1 { margin: 0; font-size: 25px; letter-spacing: -.03em; }
      p, li { color: #586579; font-size: 14px; line-height: 1.65; }
      a { display: block; margin: 20px 0 14px; padding: 13px 16px; border-radius: 9px; text-align: center; text-decoration: none; background: #182136; color: white; font-weight: 700; }
      small { display: block; color: #7a6570; line-height: 1.55; }
    </style>
  </head>
  <body>
    <main>
      <h1>FTranslate Mobile</h1>
      <p>iPhone 本地论文阅读版：PDF 阅读与段落翻译、arXiv 检索、本地论文库。</p>
      <a id="install-link" href="#">安装到这台 iPhone</a>
      <ol>
        <li>使用 Safari 打开本 HTTPS 页面。</li>
        <li>确认本机 UDID 已加入该 Ad Hoc 构建。</li>
        <li>安装后在“设置 → 隐私与安全性”启用开发者模式。</li>
      </ol>
      <small>此安装包不经过 App Store。未登记设备、签名过期或被撤销时，iOS 会拒绝安装或启动。</small>
    </main>
    <script>
      const manifestUrl = new URL('manifest.plist', window.location.href).href;
      document.querySelector('#install-link').href = `itms-services://?action=download-manifest&url=${encodeURIComponent(manifestUrl)}`;
    </script>
  </body>
</html>
