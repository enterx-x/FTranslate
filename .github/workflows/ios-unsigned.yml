name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - codex/ios-mobile-reader
    paths:
      - .github/workflows/ios-unsigned.yml
      - .env.mobile
      - capacitor.config.ts
      - ios/**
      - package.json
      - package-lock.json
      - scripts/build-ios-unsigned.sh
      - scripts/normalize-capacitor-spm-paths.mjs
      - src/renderer/main.tsx
      - src/renderer/mobile/**
      - vite.config.ts

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    name: Build unsigned IPA for personal sideloading
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned IPA
        run: bash scripts/build-ios-unsigned.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: FTranslate-unsigned-ios
          path: |
            ios/App/output/unsigned/FTranslate-unsigned.ipa
            ios/App/output/unsigned/FTranslate-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
